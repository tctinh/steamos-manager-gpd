[[device]]
dmi.sys_vendor = "GPD"
dmi.product_name = "G1617-01"
device = "gpd_win_mini"
variant = "G1617-01"
friendly_name = "GPD WIN Mini"

[[device]]
dmi.sys_vendor = "GPD"
dmi.product_name = "G1617-02"
device = "gpd_win_mini"
variant = "G1617-02"
friendly_name = "GPD WIN Mini"

[tdp_limit]
method = "acpi_call_alib"

[tdp_limit.range]
min = 4
max = 28

[tdp_limit.acpi_call_alib]
alib_method = "\\_SB.ALIB"
stapm_limit_id = 0x05
fast_limit_id = 0x06
slow_limit_id = 0x07
slow_time_id = 0x08
stapm_time_id = 0x01
temp_target_id = 0x03
skin_limit_id = 0x2e
power_scale = 1000
time_scale = 1
temp_scale = 1
slow_time = 10
stapm_time = 100
temp_target = 85

[gpu_performance]
driver = "amdgpu"

[gpu_power_profile]
driver = "amdgpu"

[inputplumber]
target_devices = ["deck-uhid", "keyboard", "mouse"]
