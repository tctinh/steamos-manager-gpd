#
# tuned configuration: GPD Win Mini power-saver (8W)
#

[main]
summary=GPD Win Mini power saver — 8W TDP via ACPI/ALIB
include=powersave

# Bias the shared APU TDP toward the iGPU: keep CPU boost off and pin
# EPP to "power" so the SMU prefers cutting CPU clocks first.
[cpu]
governor=powersave
boost=0
energy_performance_preference=power

# Disable AMD vari-bright (inherited from powersave); it causes visible
# colour shift on the GPD Win Mini panel.
[video]
panel_power_savings=0

# Disable SMT for lower per-core power and reduced contention.
[sysfs]
/sys/devices/system/cpu/smt/control=off

[script]
script=script.sh
